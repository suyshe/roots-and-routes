le:"Unlit underpass near Swargate",description:"The pedestrian underpass lights have been dead for months; feels unsafe to walk through after 8pm.",lat:18.5018,lng:73.8578,severity:"high",status:"open",author:"Night commuter",dateLabel:"Reported 3 days ago",createdAt:ce(3)},{id:"demo-15",type:"safety",category:"traffic",title:"Dangerous crossing at JM Road junction",description:"Signal timings are too short for the foot traffic; seniors and students rush across against the flow.",lat:18.5135,lng:73.8475,severity:"medium",status:"in-progress",author:"Residents’ association",dateLabel:"Reported 2 weeks ago",createdAt:ce(14)},{id:"demo-16",type:"safety",category:"lighting",title:"Broken streetlights on University Road",description:"The stretch of University Road near the main gate is pitch dark after 10pm.",lat:18.5522,lng:73.8249,severity:"medium",status:"open",author:"M. Bhandarkar",dateLabel:"Reported 1 week ago",createdAt:ce(8)},{id:"demo-17",type:"safety",category:"flooding",title:"Waterlogging on Karve Road in monsoon",description:"Every heavy shower floods the low point near Nal Stop; auto fares double and buses crawl.",lat:18.5107,lng:73.8422,severity:"medium",status:"open",author:"Bus commuter",dateLabel:"Reported 5 days ago",createdAt:ce(5)},{id:"demo-18",type:"safety",category:"other",title:"Garbage pileup near Shivajinagar bus stand",description:"Open garbage attracts strays; the area needs a better collection schedule.",lat:18.5287,lng:73.8535,severity:"low",status:"open",author:"Shopkeeper",dateLabel:"Reported 2 weeks ago",createdAt:ce(13)},{id:"demo-19",type:"safety",category:"traffic",title:"Speeding on Baner Road",description:"No speed breakers between the flyover and Sus; evening walkers hug the footpath.",lat:18.5596,lng:73.7865,severity:"high",status:"open",author:"Evening walker",dateLabel:"Reported 1 week ago",createdAt:ce(6)},{id:"demo-20",type:"safety",category:"other",title:"Loose manhole cover on Laxmi Road",description:"The cover rocks under
