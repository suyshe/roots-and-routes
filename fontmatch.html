const GX = 48, GY = 64;

function parseGrid(s) { const a=[]; for(let y=0;y<GY;y++){ a.push([...s.slice(y*GX,(y+1)*GX)].map(Number)); } return a; }
function binarizeCanvasGlyph(ch, font) {
  const cap = 260;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d', { willReadFrequently: true });
  c.width = cap * 1.5; c.height = cap * 1.7;
  ctx.font = font;
  ctx.fillStyle = '#000';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillText(ch, 10, cap * 1.3);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
  const ink = (i) => d[i+3] > 128 && (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) < 128;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    if (ink((y*c.width + x)*4)) { if (x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  }
  if (maxX < 0) return null;
  const gw = maxX - minX + 1, gh = maxY - minY + 1;
  const grid = [];
  for (let gy = 0; gy < GY; gy++) {
    const row = [];
    for (let gx = 0; gx < GX; gx++) {
      const xa = minX + gx*gw/GX, xb = minX + (gx+1)*gw/GX;
      const ya = minY + gy*gh/GY, yb = minY + (gy+1)*gh/GY;
      let tot = 0, n = 0;
      for (let yy = Math.floor(ya); yy < Math.ceil(yb); yy++)
        for (let xx = Math.floor(xa); xx < Math.ceil(xb); xx++) {
          if (yy < minY || yy > maxY || xx < minX || xx > maxX) continue;
          tot += ink((yy*c.width + xx)*4) ? 1 : 0; n++;
        }
      row.push(n && tot/n > 0.45 ? 1 : 0);
    }
    grid.push(row);
  }
  return grid;
}

  for (let y = 0; y < GY; y++) for (let x = 0; x < GX; x++) { d += (a[y][x] !== b[y][x]) ? 1 : 0; n++; }
